<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C案 グリーン・コンター スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.cm-btn:focus-visible{outline:2px solid #2F6FB0;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #17301F; background: #E3EBE0">
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0">
<path d="{{contour}}" fill="none" stroke="#C9D8C7" stroke-width="1"></path>
</svg>

<div style="position: absolute; left: 40px; top: 118px; width: 320px; height: 418px">
<sc-for list="{{dots}}" as="p" hint-placeholder-count="258">
<span style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; width: {{p.s}}px; height: {{p.s}}px; margin: {{p.m}}px 0 0 {{p.m}}px; border-radius: 50%; background: {{p.c}}; border: {{p.ring}}"></span>
</sc-for>
</div>

<div style="position: absolute; left: 14px; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 6px 20px rgba(23,48,31,0.14); padding: 12px 14px; display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 34 34" fill="none" stroke="#1F4A34" stroke-width="2"><circle cx="17" cy="17" r="15"></circle><circle cx="17" cy="17" r="9"></circle><circle cx="17" cy="17" r="2.5" fill="#1F4A34"></circle></svg>
<span style="flex: 1; font-weight: 900; font-size: 15px">全国ジュニアゴルフ大会カレンダー</span>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button class="cm-btn" aria-pressed="{{c.sel}}" onClick="{{c.pick}}" style="font: inherit; font-size: 12px; font-weight: 700; color: {{c.fg}}; background: {{c.bg}}; border: 0; border-radius: 999px; padding: 0 14px; min-height: 36px; box-shadow: 0 3px 10px rgba(23,48,31,0.12); cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: #FFFFFF; border-radius: 26px 26px 0 0; box-shadow: 0 -8px 30px rgba(23,48,31,0.16); padding: 10px 0 0">
<span style="display: block; width: 40px; height: 4px; border-radius: 999px; background: #C9D8C7; margin: 0 auto 12px"></span>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 18px">
<span style="font-size: 17px; font-weight: 900">締切が近い大会</span>
<span style="font-size: 12px; color: #4D6455">受付中・まもなく <b style="color: #D9622B">52</b>件</span>
</div>
<div style="display: flex; gap: 10px; overflow: hidden; padding: 12px 18px 0">
<sc-for list="{{deadlines}}" as="d" hint-placeholder-count="3">
<a href="#" style="flex: 0 0 236px; display: flex; flex-direction: column; gap: 8px; background: #EEF3EC; border-radius: 18px; padding: 14px 16px; color: inherit; text-decoration: none">
<span style="align-self: start; font-size: 12px; font-weight: 900; color: {{d.fg}}; background: {{d.bg}}; border-radius: 999px; padding: 4px 10px">あと{{d.n}}日　締切 {{d.close}}</span>
<span style="font-size: 14px; font-weight: 700; line-height: 1.45">{{d.name}}</span>
<span style="font-size: 12px; color: #4D6455">{{d.pref}}　開催 {{d.date}}</span>
</a>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 16px; border-top: 1px solid #E3EBE0; padding-bottom: 14px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button class="cm-btn" aria-pressed="{{t.sel}}" onClick="{{t.pick}}" style="font: inherit; font-size: 11px; font-weight: 700; color: {{t.fg}}; background: none; border: 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>{{t.label}}</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
