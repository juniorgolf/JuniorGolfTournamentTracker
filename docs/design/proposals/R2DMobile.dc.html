<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>改訂D案 スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rdm-btn:focus-visible{outline:3px solid #F6C343;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif; color: #1D2A44; background: #FFFDF7; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 10px; padding: 14px 18px 6px">
<span style="width: 34px; height: 34px; border-radius: 11px; background: #F6C343; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V3l9 4-9 4"></path><path d="M5 21h8"></path></svg>
</span>
<span style="font-weight: 800; font-size: 15px">全国ジュニアゴルフ大会カレンダー</span>
</header>

<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding-top: 6px">
<h1 style="margin: 0; padding: 0 18px; font-size: 23px; font-weight: 800; line-height: 1.4">今週の申込、<span style="box-shadow: inset 0 -0.42em 0 #F6C343">わすれていませんか？</span></h1>

<div role="group" aria-label="主催者の種類" style="display: flex; gap: 6px; padding: 0 18px; overflow: hidden; white-space: nowrap">
<sc-for list="{{chips}}" as="k" hint-placeholder-count="5">
<button class="rdm-btn" aria-pressed="{{k.sel}}" onClick="{{k.pick}}" style="font: inherit; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: {{k.fg}}; background: {{k.bg}}; border: 2px solid {{k.bd}}; border-radius: 999px; padding: 0 12px 0 6px; min-height: 36px; cursor: pointer">
<span style="width: 20px; height: 20px; border-radius: 50%; background: {{k.dbg}}; display: flex; align-items: center; justify-content: center">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{k.dfg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{k.icon}}"></path></svg>
</span>{{k.name}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 18px">
<sc-for list="{{days}}" as="w" hint-placeholder-count="7">
<button class="rdm-btn" aria-pressed="{{w.sel}}" onClick="{{w.pick}}" style="font: inherit; background: {{w.bg}}; border: 2px solid {{w.bd}}; border-radius: 14px; padding: 5px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: #1D2A44">
<span style="font-size: 11px; font-weight: 700; color: {{w.dc}}">{{w.dow}}</span>
<span style="font-size: 18px; font-weight: 800">{{w.day}}</span>
<span style="display: flex; gap: 2px; height: 6px">
<sc-for list="{{w.marks}}" as="m" hint-placeholder-count="2">
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{m.c}}"></span>
</sc-for>
</span>
</button>
</sc-for>
</div>

<div style="padding: 0 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 800">{{picked.title}}</span>
<sc-for list="{{picked.items}}" as="c" hint-placeholder-count="3">
<a href="#" style="position: relative; display: flex; flex-direction: column; background: #FFFFFF; border: 2px solid #E8E2D2; border-radius: 20px; color: inherit; text-decoration: none; opacity: {{c.op}}">
<span style="display: flex; align-items: center; gap: 8px; background: {{c.tint}}; border-radius: 18px 18px 0 0; padding: 7px 12px; border-bottom: 3px solid {{c.color}}">
<span style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; border: 2px solid {{c.color}}; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; color: {{c.color}}">
<sc-if value="{{c.hasAbbr}}">{{c.abbr}}</sc-if>
<sc-if value="{{c.noAbbr}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"></path></svg></sc-if>
</span>
<span style="font-size: 11px; font-weight: 800; color: {{c.color}}">{{c.cat}}</span>
<span style="margin-left: auto; font-size: 11px; font-weight: 800; color: {{c.kfg}}; background: {{c.kbg}}; border-radius: 999px; padding: 2px 8px">{{c.kind}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; padding: 10px 76px 12px 14px">
<span style="font-size: 14px; font-weight: 800; line-height: 1.45">{{c.name}}</span>
<span style="font-size: 11px; color: #4C5872">{{c.sub}}</span>
</span>
<sc-if value="{{c.stamp}}">
<span style="position: absolute; right: 10px; bottom: 8px; width: 56px; height: 56px; border-radius: 50%; border: 3px dashed #E2574C; background: #FFFDF7; color: #B8352B; transform: rotate(-12deg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1">
<span style="font-size: 10px; font-weight: 800">あと</span><span style="font-size: 18px; font-weight: 800">{{c.left}}日</span>
</span>
</sc-if>
</a>
</sc-for>
</div>
</div>

<nav aria-label="表示の切り替え" style="margin: 10px 14px 20px; display: grid; grid-template-columns: repeat(4, 1fr); background: #1D2A44; border-radius: 22px; padding: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button class="rdm-btn" aria-pressed="{{t.sel}}" onClick="{{t.pick}}" style="font: inherit; font-size: 11px; font-weight: 700; color: {{t.fg}}; background: {{t.bg}}; border: 0; border-radius: 16px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>{{t.label}}</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 1, tab: 1, cat: null };
  }
  renderVals() {
    const CAT = {
      jjga: ['JJGA', '#1D5FA8', '#E6EEF8', 'M6 21V4M6 4h11l-2 4 2 4H6'],
      junior: ['ジュニアツアー・育成', '#00796B', '#E0F1EE', 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z'],
      union: ['ゴルフ連盟・協会', '#3B6B1F', '#E8F0E1', 'M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z'],
      school: ['学校ゴルフ連盟', '#6A47A8', '#EEE9F7', 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5'],
      media: ['新聞・テレビ・出版', '#A35C00', '#F7ECDD', 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5M8 16h3'],
      pro: ['プロ団体', '#B0306A', '#F7E4EE', 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8'],
      other: ['企業・ゴルフ場・自治体', '#56636E', '#ECEFF1', 'M4 20V8l6-3v15M10 20V4h10v16M3 20h18M13 8h4M13 12h4M13 16h4']
    };
    const SHORT = { jjga: 'JJGA', junior: 'ツアー', union: '連盟・協会', school: '学校' };
    const sel = this.state.cat;
    const chips = [null, 'jjga', 'junior', 'union', 'school'].map((key) => {
      const on = sel === key;
      const color = key ? CAT[key][1] : '#1D2A44';
      return {
        name: key ? SHORT[key] : 'すべて', sel: String(on), icon: key ? CAT[key][3] : 'M4 6h16M4 12h16M4 18h16',
        fg: on ? '#FFFFFF' : '#1D2A44', bg: on ? color : '#FFFFFF', bd: on ? color : '#E8E2D2',
        dbg: on ? '#FFFFFF' : (key ? CAT[key][2] : '#F3EEDF'), dfg: color, pick: () => this.setState({ cat: key })
      };
    });
    const K = { close: ['申込締切', '#FCE3E0', '#8E2A22'], open: ['受付開始', '#E3EAFB', '#2B4590'], start: ['大会の日', '#FFF4D2', '#1D2A44'] };
    // [種類, 主催の種類, 略称, 大会名, 補足, 締切までの日数]
    const W = [
      [18, '日', [['start', 'junior', 'JJGT', 'JJGT 関東予選会（千葉）', '千葉　紫カントリークラブ あやめ36', 0], ['start', 'pro', 'JLPGA', 'JLPGA全日本小学生ゴルフトーナメント 決勝', '福島　グリーンアカデミーカントリークラブ', 0]]],
      [19, '月', [['close', 'jjga', 'JJGA', '石川遼カップ 地区大会　19会場', '13県　大会の日 12/12〜1/11', 1], ['close', 'junior', 'JJGT', '日本トリムカップ 関東予選会（千葉）', '千葉　大会の日 10/25', 1], ['start', 'school', '', '大阪府・和歌山県中学校ゴルフ選手権 秋季大会 男子', '大阪　太子カントリー倶楽部', 0]]],
      [20, '火', [['close', 'other', '', 'エナジック沖縄県小学生・中学生ゴルフ大会', '沖縄　大会の日 10/31', 2], ['open', 'school', '', '九州沖縄高等学校・中学校ゴルフ選手権 春季大会', '鹿児島　大会の日 12/24', 0]]],
      [21, '水', [['close', 'union', '', '長野県小学生大会（関東小学生大会 長野県予選）', '長野　大会の日 11/1', 3]]],
      [22, '木', []],
      [23, '金', [['close', 'other', '', 'Jack Bunny!! MY FIRST TEE 関東大会', '千葉　大会の日 11/8', 5], ['start', 'school', '', '京都府高等学校・中学校ゴルフ選手権 秋季大会', '京都　瑞穂ゴルフ倶楽部', 0]]],
      [24, '土', [['start', 'union', '', '島根県ジュニアゴルフ秋季大会', '島根　出雲ゴルフ倶楽部', 0], ['start', 'media', '', '第20回 北海道小学生ゴルフ大会', '北海道　早来カントリー倶楽部 北コース', 0]]]
    ];
    const days = W.map(([day, dow, items], i) => {
      const on = this.state.day === i;
      const cs = [...new Set(items.map((e) => e[1]))].slice(0, 3);
      return {
        day, dow, sel: String(on), bg: on ? '#F6C343' : '#FFFFFF', bd: on ? '#F6C343' : '#E8E2D2',
        dc: dow === '日' ? '#B8352B' : dow === '土' ? '#2B4590' : '#4C5872',
        marks: cs.map((k) => ({ c: CAT[k][1] })), pick: () => this.setState({ day: i })
      };
    });
    const [pd, pw, pitems] = W[this.state.day];
    const picked = {
      title: '10/' + pd + '（' + pw + '）の予定' + (pitems.length ? '　' + pitems.length + '件' : '　なし'),
      items: pitems.map(([kind, k, abbr, name, sub, left]) => ({
        kind: K[kind][0], kbg: K[kind][1], kfg: K[kind][2],
        cat: CAT[k][0], color: CAT[k][1], tint: CAT[k][2], icon: CAT[k][3],
        abbr, hasAbbr: !!abbr, noAbbr: !abbr, name, sub, left, stamp: left > 0,
        op: sel && sel !== k ? 0.25 : 1
      }))
    };
    const T = [
      ['地図', 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14'],
      ['手帳', 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
      ['大会', 'M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z'],
      ['発表待ち', 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z']
    ];
    const tabs = T.map(([label, icon], i) => {
      const on = this.state.tab === i;
      return { label, icon, sel: String(on), fg: on ? '#1D2A44' : '#FFFDF7', bg: on ? '#F6C343' : 'transparent', pick: () => this.setState({ tab: i }) };
    });
    return { chips, days, picked, tabs };
  }
}
</script>
</body>
</html>
