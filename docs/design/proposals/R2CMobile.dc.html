<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>改訂C案 スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rcm-btn:focus-visible{outline:2px solid #C8441C;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #14211B; background: #E3EBE0">
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0">
<path d="{{contour}}" fill="none" stroke="#CCDACA" stroke-width="1"></path>
</svg>

<div style="position: absolute; left: 40px; top: 112px; width: 320px; height: 418px">
<sc-for list="{{dots}}" as="p" hint-placeholder-count="232">
<span style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; width: {{p.s}}px; height: {{p.s}}px; margin: {{p.m}}px 0 0 {{p.m}}px; border-radius: 50%; background: {{p.c}}; border: {{p.ring}}; box-shadow: {{p.sh}}; opacity: {{p.op}}"></span>
</sc-for>
<span aria-hidden="true" style="position: absolute; left: 68.7%; top: 51.7%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #14211B"></span>
</div>

<div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="background: #FFFFFF; border-radius: 16px; box-shadow: 0 6px 20px rgba(20,33,27,0.14); padding: 10px 14px; display: flex; align-items: center; gap: 10px">
<svg width="24" height="24" viewBox="0 0 34 34" fill="none" stroke="#1F4A34" stroke-width="2"><circle cx="17" cy="17" r="15"></circle><circle cx="17" cy="17" r="9"></circle><circle cx="17" cy="17" r="2.5" fill="#1F4A34"></circle></svg>

</div>
<div role="group" aria-label="主催者の種類" style="display: flex; gap: 6px; overflow: hidden; white-space: nowrap">
<sc-for list="{{chips}}" as="k" hint-placeholder-count="5">
<button class="rcm-btn" aria-pressed="{{k.sel}}" onClick="{{k.pick}}" style="font: inherit; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: {{k.fg}}; background: {{k.bg}}; border: 0; border-radius: 999px; padding: 0 12px; min-height: 36px; box-shadow: 0 3px 10px rgba(20,33,27,0.12); cursor: pointer">
<span style="width: 9px; height: 9px; border-radius: 50%; background: {{k.dot}}"></span>{{k.name}}</button>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 312px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(20,33,27,0.16); padding-top: 10px">
<span style="display: block; width: 40px; height: 4px; border-radius: 999px; background: #CCDACA; margin: 0 auto 10px"></span>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px 8px">
<span style="font-size: 13px; font-weight: 700">ムーンレイクゴルフクラブ 茂原コース</span>
<span style="font-size: 12px; color: #3C4A42">2大会</span>
</div>
<div style="display: flex; gap: 10px; overflow: hidden; padding: 0 16px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
<article style="flex: 0 0 300px; background: #FFFFFF; border: 1px solid #DFE3DC; border-radius: 14px; overflow: hidden">
<div style="background: {{c.tint}}; border-top: 4px solid {{c.color}}; padding: 8px 12px; display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 9px; background: #FFFFFF; border: 1.5px solid {{c.color}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: {{c.color}}">{{c.abbr}}</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 10px; font-weight: 900; color: {{c.color}}">{{c.cat}}</span>
<span style="font-size: 12px">{{c.org}}</span>
</span>
<span style="margin-left: auto; font-size: 10px; font-weight: 700; border: 1px solid #9AA59F; border-radius: 999px; padding: 2px 7px">{{c.lv}}</span>
</div>
<div style="padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Shippori Mincho B1', serif; font-size: 24px; font-weight: 700; line-height: 1">{{c.date}}<span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; font-weight: 500; margin-left: 4px">{{c.dow}}曜日</span></span>
<span style="font-size: 14px; font-weight: 900; line-height: 1.45">{{c.name}}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-top: 1px dashed #D7DCD8; font-size: 12px">
<span>{{c.foot}}</span>
<span style="font-weight: 900; color: {{c.bfg}}; background: {{c.bbg}}; border: 1px solid #C8441C; border-radius: 999px; padding: 2px 9px">{{c.badge}}</span>
</div>
</article>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 0">
<a href="#" class="rcm-btn" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; font-size: 13px; font-weight: 700; color: #FFFFFF; background: #1F4A34; border-radius: 999px; text-decoration: none">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8-8-2z"></path></svg>Googleマップで経路</a>
<a href="#" class="rcm-btn" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 13px; font-weight: 700; color: #1F4A34; background: #FFFFFF; border: 1.5px solid #1F4A34; border-radius: 999px; text-decoration: none">一覧で見る</a>
</div>
</div>
</div>
</x-dc>

      const size = k === 0 ? 4 : o ? 10 : 8;
      return {
        x, y, s: size, m: -size / 2,
        c: k === 0 ? '#A5B5A9' : COLOR[key],
        ring: o ? '1.5px solid #FFFFFF' : '0',
        sh: o ? '0 0 0 1.5px #C8441C' : 'none',
