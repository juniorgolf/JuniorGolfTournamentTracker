<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>改訂A案 スマホ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.rm-btn:focus-visible{outline:2px solid #C8441C;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #14211B; background: #F7F8F4; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; border-bottom: 1px solid #14211B; background: #F7F8F4">
<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 16px; letter-spacing: 0.04em">全国ジュニアゴルフ大会カレンダー</span>
<button class="rm-btn" aria-label="メニュー" style="width: 44px; height: 44px; margin-right: -10px; background: none; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14211B" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</header>

<div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
<section style="padding: 20px 18px 16px; display: flex; justify-content: space-between; align-items: end; gap: 12px">
<h1 style="margin: 0; font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 36px; line-height: 1.15">申込を、<br>逃さない。</h1>
<span style="display: flex; flex-direction: column; align-items: end; gap: 2px">
<span style="font-family: 'Shippori Mincho B1', serif; font-size: 40px; font-weight: 700; line-height: 1; color: #C8441C">52</span>
<span style="font-size: 11px; text-align: right; line-height: 1.4">申込受付中<br>・まもなく</span>
</span>
</section>

<div role="group" aria-label="主催者の種類" style="display: flex; gap: 6px; padding: 0 18px 14px; overflow: hidden; white-space: nowrap">
<sc-for list="{{chips}}" as="k" hint-placeholder-count="5">
<button class="rm-btn" aria-pressed="{{k.sel}}" onClick="{{k.pick}}" style="font: inherit; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: {{k.fg}}; background: {{k.bg}}; border: 1.5px solid {{k.bd}}; border-radius: 999px; padding: 0 12px; min-height: 36px; cursor: pointer">
<span style="width: 9px; height: 9px; border-radius: 3px; background: {{k.dot}}"></span>{{k.name}}</button>
</sc-for>
</div>

<section style="padding: 4px 18px 0; border-top: 1px solid #D7DCD8" aria-labelledby="rm-dl">
<div style="display: flex; align-items: baseline; gap: 10px; margin: 14px 0 10px">
<span style="font-family: 'Shippori Mincho B1', serif; font-size: 14px; color: #C8441C; font-weight: 700">01</span>
<h2 id="rm-dl" style="margin: 0; font-family: 'Shippori Mincho B1', serif; font-size: 21px; font-weight: 800">締切が近い大会</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<a href="#" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DFE3DC; border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; opacity: {{c.op}}">
<span style="background: {{c.tint}}; border-top: 4px solid {{c.color}}; padding: 8px 12px; display: flex; align-items: center; gap: 10px">
<span style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; background: #FFFFFF; border: 1.5px solid {{c.color}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: {{c.color}}">
<sc-if value="{{c.hasAbbr}}">{{c.abbr}}</sc-if>
<sc-if value="{{c.noAbbr}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 10px; font-weight: 900; color: {{c.color}}">{{c.cat}}</span>
<span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.org}}</span>
</span>
<span style="margin-left: auto; font-size: 10px; font-weight: 700; border: 1px solid #9AA59F; border-radius: 999px; padding: 2px 7px">{{c.lv}}</span>
</span>
<span style="display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 14px">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Shippori Mincho B1', serif; font-size: 26px; font-weight: 800; line-height: 1; color: #C8441C">{{c.close}}</span>
<span style="align-self: start; font-size: 11px; font-weight: 900; color: #FFFFFF; background: #C8441C; border-radius: 999px; padding: 2px 8px">あと{{c.left}}日</span>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 14px; font-weight: 900; line-height: 1.45">{{c.name}}</span>
<span style="font-size: 11px; color: #3C4A42">{{c.pref}}　開催 {{c.date}}</span>
</span>
</span>
</a>
</sc-for>
</div>
</section>
</div>

<nav aria-label="表示の切り替え" style="display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #14211B; background: #F7F8F4; padding-bottom: 16px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button class="rm-btn" aria-pressed="{{t.sel}}" onClick="{{t.pick}}" style="font: inherit; font-size: 11px; font-weight: {{t.weight}}; color: {{t.fg}}; background: none; border: 0; border-top: 3px solid {{t.line}}; margin-top: -2px; padding: 8px 0 6px; min-height: 54px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>{{t.label}}</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: null, tab: 2 };
  }
  renderVals() {
    const CAT = {
      jjga: ['JJGA', '#1D5FA8', '#E6EEF8', 'M6 21V4M6 4h11l-2 4 2 4H6'],
      junior: ['ジュニアツアー・育成', '#00796B', '#E0F1EE', 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z'],
      union: ['ゴルフ連盟・協会', '#3B6B1F', '#E8F0E1', 'M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z'],
      school: ['学校ゴルフ連盟', '#6A47A8', '#EEE9F7', 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5'],
      other: ['企業・ゴルフ場・自治体', '#56636E', '#ECEFF1', 'M4 20V8l6-3v15M10 20V4h10v16M3 20h18M13 8h4M13 12h4M13 16h4']
    };
    const sel = this.state.cat;
    const chips = [{ key: null, name: 'すべて', color: '#14211B' }]
      .concat(['jjga', 'junior', 'union', 'school'].map((key) => ({ key, name: CAT[key][0], color: CAT[key][1] })))
      .map((c) => {
        const on = sel === c.key;
        return { name: c.name, sel: String(on), dot: on ? '#FFFFFF' : c.color, fg: on ? '#FFFFFF' : '#14211B', bg: on ? c.color : '#FFFFFF', bd: on ? c.color : '#D7DCD8', pick: () => this.setState({ cat: c.key }) };
      });
    const cards = [
      ['jjga', 'JJGA', '日本ジュニアゴルフ協会', '小・中', '10/19', 1, '石川遼カップ 地区大会　19会場', '13県', '12/12〜1/11'],
      ['junior', 'JJGT', '日本ジュニアゴルフツアー', '小・中', '10/19', 1, '日本トリムカップ 関東予選会（千葉）', '千葉', '10/25'],
      ['other', '', 'エナジック株式会社', '小・中', '10/20', 2, 'エナジック沖縄県小学生・中学生ゴルフ大会', '沖縄', '10/31']
    ].map(([k, abbr, org, lv, close, left, name, pref, date]) => {
      const [cat, color, tint, icon] = CAT[k];
      return { cat, color, tint, icon, abbr, org, lv, close, left, name, pref, date, hasAbbr: !!abbr, noAbbr: !abbr, op: sel && sel !== k ? 0.22 : 1 };
    });
    const T = [
      ['地図', 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14'],
      ['カレンダー', 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
      ['大会', 'M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z'],
      ['発表待ち', 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z']
    ];
    const tabs = T.map(([label, icon], i) => {
      const on = this.state.tab === i;
      return { label, icon, sel: String(on), weight: on ? 700 : 400, fg: on ? '#14211B' : '#3C4A42', line: on ? '#C8441C' : 'transparent', pick: () => this.setState({ tab: i }) };
    });
    return { chips, cards, tabs };
  }
}
</script>
</body>
</html>
